name: Version 0.0.7

on:
  push:
    branches: [main, version-0.0.7]
    tags: ["v0.0.7"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Version 0_0_7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  build:
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: Version 0_0_7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate application icon
        run: python make_icon.py
      - name: Build executable
        run: pyinstaller deployment/Agent.spec --clean --noconfirm
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist\MT5Agent-v0.0.7.exe"
          if (-not (Test-Path $exe)) { throw "Expected executable was not created: $exe" }
      - name: Smoke test unavailable-terminal path
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\MT5Agent-v0.0.7.exe" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 1) { throw "Expected exit code 1 when terminal is unavailable, got $($process.ExitCode)" }
      - name: Smoke test invalid configuration
        shell: pwsh
        run: |
          $env:MT5_AGENT_HTTP_PORT = "invalid"
          $process = Start-Process -FilePath "dist\MT5Agent-v0.0.7.exe" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 2) { throw "Expected exit code 2 for invalid startup configuration, got $($process.ExitCode)" }
      - name: Calculate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\MT5Agent-v0.0.7.exe" -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Out-File sha256.txt -Encoding utf8
          Get-Content sha256.txt
      - name: Upload executable and checksum
        uses: actions/upload-artifact@v4
        with:
          name: MT5Agent-v0.0.7
          path: |
            Version 0_0_7/dist/MT5Agent-v0.0.7.exe
            Version 0_0_7/sha256.txt
