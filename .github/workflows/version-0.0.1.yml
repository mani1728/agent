name: Agent v0.0.1

on:
  push:
    branches:
      - version-0.0.1
    tags:
      - "v0.0.1*"
  pull_request:
    branches:
      - main
      - version-0.0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Version 0_0_1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r agent/requirements.txt

      - name: Run tests
        run: pytest

  build:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Version 0_0_1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r agent/requirements.txt

      - name: Build EXE
        run: pyinstaller agent/deployment/Agent.spec --clean --noconfirm

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agent-v0.0.1-windows
          path: Version 0_0_1/dist/Agent.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v0.0.1')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/Agent.exe" --title "Agent ${{ github.ref_name }}" --generate-notes
