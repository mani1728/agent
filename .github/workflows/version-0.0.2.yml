name: Version 0.0.2

on:
  push:
    branches: [main, version-0.0.2]
    tags: ["v0.0.2"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Version 0_0_2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  build:
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: Version 0_0_2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate icon
        run: python make_icon.py

      - name: Build executable
        run: pyinstaller deployment/Agent.spec --clean --noconfirm

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist\MT5Agent-v0.0.2.exe"
          if (-not (Test-Path $exe)) { throw "Expected executable was not created: $exe" }

      - name: Smoke test unavailable-terminal path
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\MT5Agent-v0.0.2.exe" -Wait -PassThru -NoNewWindow
          $code = $process.ExitCode
          if ($code -ne 1) { throw "Expected exit code 1 when terminal is unavailable, got $code" }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MT5Agent-v0.0.2
          path: Version 0_0_2/dist/MT5Agent-v0.0.2.exe
