name: MT5 Agent CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mt5-agent-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: Version 0_0_9
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify runner toolchain
        run: |
          python --version
          python -m pip --version
          pwsh --version
          git --version
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  build:
    runs-on: self-hosted
    needs: test
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: Version 0_0_9
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify runner toolchain
        run: |
          python --version
          python -m pip --version
          pwsh --version
          git --version
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate application icon
        run: python make_icon.py
      - name: Build executable
        run: python -m PyInstaller deployment/Agent.spec --clean --noconfirm
      - name: Verify executable
        run: |
          $exe = "dist\MT5Agent-v0.0.9.exe"
          if (-not (Test-Path $exe)) { throw "Expected executable was not created: $exe" }
      - name: Smoke test unavailable-terminal path
        run: |
          $process = Start-Process -FilePath "dist\MT5Agent-v0.0.9.exe" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 1) { throw "Expected exit code 1 when terminal is unavailable, got $($process.ExitCode)" }
      - name: Smoke test invalid configuration
        run: |
          $env:MT5_AGENT_HTTP_PORT = "invalid"
          $process = Start-Process -FilePath "dist\MT5Agent-v0.0.9.exe" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 2) { throw "Expected exit code 2 for invalid startup configuration, got $($process.ExitCode)" }
      - name: Calculate SHA-256
        run: |
          $hash = (Get-FileHash "dist\MT5Agent-v0.0.9.exe" -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Out-File sha256.txt -Encoding utf8
          Get-Content sha256.txt
      - name: Upload executable and checksum
        uses: actions/upload-artifact@v5
        with:
          name: MT5Agent-v0.0.9
          path: |
            Version 0_0_9/dist/MT5Agent-v0.0.9.exe
            Version 0_0_9/sha256.txt
